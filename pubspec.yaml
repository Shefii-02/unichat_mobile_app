name: unichat_mobile_app
description: "Flowexa — WhatsApp Business CRM & AI automation, mobile app"
#publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management — Riverpod 3
  flutter_riverpod: ^3.0.0

  # Navigation
  go_router: ^14.6.2

  # Device-login QR scanner + PIN input
  mobile_scanner: ^7.0.0
  pinput: ^5.0.0
  qr_flutter: ^4.1.0

  # Network
  dio: ^5.6.0
  pretty_dio_logger: ^1.4.0

  # WebSocket
  socket_io_client: ^2.0.3+1

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  badges: ^3.1.2
  fl_chart: ^0.68.0
  percent_indicator: ^4.2.3
  flutter_slidable: ^3.1.1

  # Media
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  video_player: ^2.9.1
  audioplayers: ^6.0.0
  photo_view: ^0.15.0
  file_picker: ^8.1.4
  record: ^6.0.0
  mime: ^1.0.6

  # Notifications
  flutter_local_notifications: ^17.2.2
  overlay_support: ^2.1.0

  # Auth
  local_auth: ^2.3.0

  # Utils
  intl: ^0.20.0
  timeago: ^3.6.1
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  geolocator: ^13.0.1
  flutter_animate: ^4.5.0
  connectivity_plus: ^6.0.5
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  uuid: ^4.5.1
  collection: ^1.18.0
  rxdart: ^0.28.0

  # Localization
  flutter_localizations:
    sdk: flutter
  webview_flutter: ^4.14.1
  package_info_plus: ^9.0.1
  new_version_plus: ^1.0.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/sounds/
